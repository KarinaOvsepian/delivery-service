name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: delivery_variant12_test
  DB_USER: delivery_student
  DB_PASSWORD: "12345"
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/delivery_variant12_test
  SPRING_DATASOURCE_USERNAME: delivery_student
  SPRING_DATASOURCE_PASSWORD: "12345"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: delivery_variant12_test
          POSTGRES_USER: delivery_student
          POSTGRES_PASSWORD: "12345"
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Step 1 - Build project
        run: mvn clean compile -DskipTests

      - name: Step 2 - Apply Database Migrations
        run: |
          PGPASSWORD="12345" psql -h localhost -U delivery_student -d delivery_variant12_test -f migrations/V1__create_tables.sql

      - name: Step 3 - Run Unit Tests
        run: mvn test -Dtest=*UnitTest

      - name: Step 4 - Start App & Run Integration/API Tests
        run: |
          mvn spring-boot:run &
          sleep 15
          mvn test -Dtest=*IntegrationTest,*ApiTest

      - name: Step 5 - Save Test Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/