name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Step 1 - Build project
        run: mvn clean compile -DskipTests

      - name: Step 2 - Run Unit Tests
        run: mvn test -Dtest=*UnitTest

      - name: Step 3 - Start App & Run Integration/API Tests
        run: |
          mvn spring-boot:run &
          
          sleep 15
          
          mvn test -Dtest=DeliveryIntegrationTest,ShipmentApiTest

      - name: Step 4 - Save Test Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/